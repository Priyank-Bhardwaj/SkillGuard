[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard-local"
version = "0.1.0"
description = "Offline static security scanner for skill and agent bundles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
skillguard = "skillguard.cli:main"
skillguard-ui = "skillguard.gui:main"

[tool.setuptools.packages.find]
include = ["skillguard*"]
